name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The suite finishes in seconds; anything longer means a handler or a sync
    # loop is wedged. Native crypto requires Node >= 24 (matrix-sdk-crypto-nodejs).
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["24", "26"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:only
      - run: npm run check:api
      - run: npm run check:size

  # One ubuntu job for pack / audit / no-native-crypto so a GitHub Actions
  # "Failed to resolve action download info" blip does not fail three separate
  # runners that each need their own checkout + setup-node download.
  ubuntu-extras:
    name: pack / audit / no-native-crypto
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:appservice
      - run: npm pack --dry-run
      - run: npm run audit:deps
      - name: import without native crypto
        run: |
          rm -rf node_modules/@matrix-org
          node -e "import('./dist/index.js').then(m => { if (typeof m.Bot?.create !== 'function') process.exit(1); })"
          node -e "
            import('./dist/index.js').then(async (m) => {
              try { await m.loadCryptoEngine(); process.exit(1); }
              catch (err) {
                if (err.name !== 'ConfigurationError') process.exit(1);
                if (!/optional/.test(err.message)) process.exit(1);
              }
            });
          "

  live:
    name: live e2ee (synapse)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:live:ci

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Intentionally no `uses: actions/*` steps. GitHub's action-download API has been
# failing job setup with "Failed to resolve action download info" (503/500)
# while git + nodejs.org still work. Checkout and Node are installed via shell.

jobs:
  test:
    name: test (node ${{ matrix.node }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["24", "26"]
    steps:
      - name: Checkout via git
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic ${auth}"
          git fetch --depth 1 --quiet origin "${GITHUB_SHA}"
          git checkout --force --quiet FETCH_HEAD

      - name: Install Node ${{ matrix.node }}
        shell: bash
        env:
          NODE_VERSION: ${{ matrix.node }}
        run: bash .github/scripts/ci-install-node.sh

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          npm run test:only
          npm run check:api
          npm run check:size

  extras:
    name: pack / audit / no-native-crypto
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout via git
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic ${auth}"
          git fetch --depth 1 --quiet origin "${GITHUB_SHA}"
          git checkout --force --quiet FETCH_HEAD

      - name: Install Node 24
        shell: bash
        env:
          NODE_VERSION: "24"
        run: bash .github/scripts/ci-install-node.sh

      - name: Pack, audit, no-native-crypto
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          npm run test:appservice
          npm pack --dry-run
          npm run audit:deps
          rm -rf node_modules/@matrix-org
          node -e "import('./dist/index.js').then(m => { if (typeof m.Bot?.create !== 'function') process.exit(1); })"
          node -e "
            import('./dist/index.js').then(async (m) => {
              try { await m.loadCryptoEngine(); process.exit(1); }
              catch (err) {
                if (err.name !== 'ConfigurationError') process.exit(1);
                if (!/optional/.test(err.message)) process.exit(1);
              }
            });
          "

  live:
    name: live e2ee (synapse)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout via git
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic ${auth}"
          git fetch --depth 1 --quiet origin "${GITHUB_SHA}"
          git checkout --force --quiet FETCH_HEAD

      - name: Install Node 24
        shell: bash
        env:
          NODE_VERSION: "24"
        run: bash .github/scripts/ci-install-node.sh

      - name: Live Synapse suite
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          npm run test:live:ci

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The suite finishes in seconds; anything longer means a handler or a sync
    # loop is wedged. Native crypto requires Node >= 24 (matrix-sdk-crypto-nodejs).
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["24", "26"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:only
      - run: npm run check:api
      - run: npm run check:size

  # The native crypto bindings are an optionalDependency: importing `aiomatrix`
  # must work even where no prebuilt binary exists, as long as crypto is off.
  no-native-crypto:
    name: import without native crypto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: rm -rf node_modules/@matrix-org
      - name: root entry must still import
        run: node -e "import('./dist/index.js').then(m => { if (typeof m.Bot?.create !== 'function') process.exit(1); })"
      - name: loadCryptoEngine must fail with a helpful ConfigurationError
        run: |
          node -e "
            import('./dist/index.js').then(async (m) => {
              try { await m.loadCryptoEngine(); process.exit(1); }
              catch (err) {
                if (err.name !== 'ConfigurationError') process.exit(1);
                if (!/optional/.test(err.message)) process.exit(1);
              }
            });
          "

  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run audit:deps

  live:
    name: live e2ee (synapse)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:live:ci

  pack:
    name: pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:appservice
      - run: npm pack --dry-run

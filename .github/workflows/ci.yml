name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# No `uses: actions/*` — GitHub's action-download API has been failing "Set up job"
# with "Failed to resolve action download info" (503/500). Bootstrap via git +
# nodejs.org instead (.github/scripts/ci-*.sh).

jobs:
  test:
    name: test (node ${{ matrix.node }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["24", "26"]
    steps:
      - name: Checkout via git
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # Script is not in the workspace yet — inline a tiny bootstrap that
        # fetches the checkout helper from the API (not the Actions download API),
        # then runs it. Fallback: inline git fetch.
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git" 2>/dev/null \
            || git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic ${auth}"
          git config --local --add safe.directory "*"
          ok=0
          if [[ -n "${GITHUB_REF:-}" ]]; then
            for i in 1 2 3 4 5; do
              echo "fetch ${GITHUB_REF} (try $i)"
              if git fetch --depth 1 origin "${GITHUB_REF}"; then ok=1; break; fi
              sleep $((i * 4))
            done
          fi
          if [[ "$ok" -ne 1 ]]; then
            for i in 1 2 3 4 5; do
              echo "fetch ${GITHUB_SHA} (try $i)"
              if git fetch --depth 1 origin "${GITHUB_SHA}"; then ok=1; break; fi
              sleep $((i * 4))
            done
          fi
          [[ "$ok" -eq 1 ]] || { echo "git fetch failed" >&2; exit 1; }
          git checkout --force --quiet FETCH_HEAD
          git reset --hard --quiet FETCH_HEAD
          echo "HEAD=$(git rev-parse --short HEAD)"

      - name: Install Node ${{ matrix.node }}
        shell: bash
        env:
          NODE_VERSION: ${{ matrix.node }}
        run: bash .github/scripts/ci-install-node.sh

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          npm run test:only
          npm run check:api
          npm run check:size

  pack:
    name: pack / audit / no-native-crypto
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout via git
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git" 2>/dev/null \
            || git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic ${auth}"
          git config --local --add safe.directory "*"
          ok=0
          if [[ -n "${GITHUB_REF:-}" ]]; then
            for i in 1 2 3 4 5; do
              echo "fetch ${GITHUB_REF} (try $i)"
              if git fetch --depth 1 origin "${GITHUB_REF}"; then ok=1; break; fi
              sleep $((i * 4))
            done
          fi
          if [[ "$ok" -ne 1 ]]; then
            for i in 1 2 3 4 5; do
              echo "fetch ${GITHUB_SHA} (try $i)"
              if git fetch --depth 1 origin "${GITHUB_SHA}"; then ok=1; break; fi
              sleep $((i * 4))
            done
          fi
          [[ "$ok" -eq 1 ]] || { echo "git fetch failed" >&2; exit 1; }
          git checkout --force --quiet FETCH_HEAD
          git reset --hard --quiet FETCH_HEAD
          echo "HEAD=$(git rev-parse --short HEAD)"

      - name: Install Node 24
        shell: bash
        env:
          NODE_VERSION: "24"
        run: bash .github/scripts/ci-install-node.sh

      - name: Pack, audit, no-native-crypto
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          npm run test:appservice
          npm pack --dry-run
          npm run audit:deps
          rm -rf node_modules/@matrix-org
          node -e "import('./dist/index.js').then(m => { if (typeof m.Bot?.create !== 'function') process.exit(1); })"
          node -e "
            import('./dist/index.js').then(async (m) => {
              try { await m.loadCryptoEngine(); process.exit(1); }
              catch (err) {
                if (err.name !== 'ConfigurationError') process.exit(1);
                if (!/optional/.test(err.message)) process.exit(1);
              }
            });
          "

  live:
    name: live e2ee (synapse)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout via git
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git" 2>/dev/null \
            || git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic ${auth}"
          git config --local --add safe.directory "*"
          ok=0
          if [[ -n "${GITHUB_REF:-}" ]]; then
            for i in 1 2 3 4 5; do
              echo "fetch ${GITHUB_REF} (try $i)"
              if git fetch --depth 1 origin "${GITHUB_REF}"; then ok=1; break; fi
              sleep $((i * 4))
            done
          fi
          if [[ "$ok" -ne 1 ]]; then
            for i in 1 2 3 4 5; do
              echo "fetch ${GITHUB_SHA} (try $i)"
              if git fetch --depth 1 origin "${GITHUB_SHA}"; then ok=1; break; fi
              sleep $((i * 4))
            done
          fi
          [[ "$ok" -eq 1 ]] || { echo "git fetch failed" >&2; exit 1; }
          git checkout --force --quiet FETCH_HEAD
          git reset --hard --quiet FETCH_HEAD
          echo "HEAD=$(git rev-parse --short HEAD)"

      - name: Install Node 24
        shell: bash
        env:
          NODE_VERSION: "24"
        run: bash .github/scripts/ci-install-node.sh

      - name: Live Synapse suite
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          npm run test:live:ci

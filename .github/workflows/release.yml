name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish (e.g. v0.3.0)
        required: true

# One release pipeline at a time per tag (workflow_dispatch uses the input tag,
# tag-push uses github.ref_name) so a retry cannot race the first attempt.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Required for npm provenance, which signs the tarball against this run.
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run build
      - run: npm run test:only

      # A tag that disagrees with package.json produces a release nobody can
      # reproduce, so refuse instead of guessing which one is right.
      - name: tag must match package.json version
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $tag does not match package.json ($pkg)" >&2
            exit 1
          fi

      # Retries after a successful publish used to 403 on "cannot publish over
      # the previously published version". Skip when that version is already
      # on the registry so the GitHub release step can still finish.
      - name: publish to npm (skip if already published)
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "${name}@${version} is already on the registry; skipping publish"
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Draft releases (e.g. from the GitHub UI) make bare `gh release create`
      # fail with HTTP 422 "Release.tag_name already exists". Create or update.
      - name: GitHub release with the changelog section
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="$(node -p "require('./package.json').version")"
          awk -v v="$version" '
            $0 ~ "^## \\[?"v {found=1; next}
            found && /^## / {exit}
            found {print}
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "See CHANGELOG.md" > release-notes.md
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --title "v$version" --notes-file release-notes.md \
              --draft=false --latest
          else
            gh release create "$tag" \
              --title "v$version" --notes-file release-notes.md --latest
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
